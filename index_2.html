<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#1B2A44" />
<title>SOUL 3.0 — Reference Desk</title>
<meta name="description" content="AI Reference Desk for the SOUL 3.0 Library — ask in plain language, get answers, SQL, and charts." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231B2A44' stroke-width='2'%3E%3Cpath d='M3 5c2-1.2 4.5-1.6 7-1v14c-2.5-.6-5-.2-7 1V5Z'/%3E%3Cpath d='M21 5c-2-1.2-4.5-1.6-7-1v14c2.5-.6 5-.2 7 1V5Z'/%3E%3C/svg%3E" />

<!-- Fonts: Fraunces (display / catalog headings), Inter (body), IBM Plex Mono (call numbers, SQL, stamps) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Tailwind (CDN, config extended below) -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Markdown rendering for assistant answers (tables, lists, bold) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/11.1.1/marked.min.js"></script>

<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ink:      '#1B2A44',
          cream:    '#F3ECDC',
          paper:    '#FBF7EC',
          stamp:    '#B23A2E',
          shelf:    '#2F5D50',
          shelfdk:  '#22443B',
          gold:     '#A9803D',
          line:     '#CBBF9C',
          graphite: '#332F28',
        },
        fontFamily: {
          display: ['"Fraunces"', 'serif'],
          body: ['"Inter"', 'sans-serif'],
          mono: ['"IBM Plex Mono"', 'monospace'],
        },
        boxShadow: {
          card: '0 1px 0 rgba(27,42,68,0.06), 0 10px 24px -14px rgba(27,42,68,0.4)',
          drawer: 'inset 0 2px 6px rgba(0,0,0,0.35), inset 0 -3px 8px rgba(0,0,0,0.25)',
        },
      },
    },
  };
</script>

<style>
  :root { color-scheme: light; }
  html, body { height: 100%; }
  body {
    background-color: #EFE7D4;
    background-image: radial-gradient(circle at 1px 1px, rgba(27,42,68,0.05) 1px, transparent 0);
    background-size: 22px 22px;
  }
  ::selection { background: #A9803D; color: #FBF7EC; }
  *:focus-visible { outline: 2px solid #2F5D50; outline-offset: 2px; }

  /* Scrollbars */
  .scroll-thin::-webkit-scrollbar { width: 9px; height: 9px; }
  .scroll-thin::-webkit-scrollbar-track { background: transparent; }
  .scroll-thin::-webkit-scrollbar-thumb { background: rgba(27,42,68,0.22); border-radius: 20px; border: 2px solid transparent; background-clip: content-box; }
  .scroll-thin::-webkit-scrollbar-thumb:hover { background: rgba(27,42,68,0.4); background-clip: content-box; }

  /* Ruled index-card texture */
  .ruled {
    background-image: repeating-linear-gradient(to bottom, transparent 0px, transparent 27px, rgba(27,42,68,0.07) 28px);
    background-position: 0 52px;
  }

  /* Single reinforcement ring, top-left — decorative, safe from stamp collisions */
  .ring-hole { position: absolute; top: 16px; left: 16px; width: 14px; height: 14px; border-radius: 9999px;
    background: #EFE7D4; box-shadow: inset 0 1px 3px rgba(27,42,68,0.4), 0 0 0 2px rgba(27,42,68,0.08); }

  /* Wood drawer-front texture for sidebar header */
  .drawer-wood { background: linear-gradient(180deg, #2A3E5E 0%, #1B2A44 55%, #17233A 100%); }
  .brass-plate { background: linear-gradient(180deg, #E7CE93 0%, #C7A55C 55%, #A9803D 100%); border: 1px solid #8B6A32; }

  /* Due-date stamp — signature element (sized + spaced so text never collides) */
  .stamp-wrap { pointer-events: none; }
  .stamp {
    transform-origin: center;
    opacity: 0;
    transform: translate(4px,-26px) rotate(-16deg) scale(1.5);
    width: 88px; height: 88px;
  }
  .stamp.fire { animation: stampDown 460ms cubic-bezier(.2,.9,.25,1.15) forwards; }
  @keyframes stampDown {
    0%   { opacity: 0; transform: translate(4px,-26px) rotate(-16deg) scale(1.5); }
    55%  { opacity: 1; transform: translate(0,1px) rotate(-9deg) scale(0.95); }
    72%  { transform: translate(0,0) rotate(-9deg) scale(1.05); }
    100% { opacity: 0.94; transform: translate(0,0) rotate(-9deg) scale(1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .stamp.fire { animation: none; opacity: 0.94; transform: translate(0,0) rotate(-9deg) scale(1); }
    * { scroll-behavior: auto !important; }
  }

  .card-enter { animation: cardEnter 420ms ease-out both; }
  @keyframes cardEnter { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .slip-tab { clip-path: polygon(0 0, 100% 0, 100% 100%, 12px 100%, 0 calc(100% - 12px)); }

  .pulse-dot { animation: pulseDot 2.4s ease-in-out infinite; }
  @keyframes pulseDot { 0%,100% { box-shadow: 0 0 0 0 rgba(47,93,80,0.55);} 70% { box-shadow: 0 0 0 7px rgba(47,93,80,0);} }

  .card-slide { animation: cardSlide 900ms ease-in-out infinite; }
  @keyframes cardSlide { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(6px); } }

  /* Top progress bar while a request is in flight */
  #progressBar { transform: scaleX(0); transform-origin: left; transition: transform 220ms ease-out, opacity 220ms; }
  #progressBar.loading { animation: progressGrow 1.4s ease-in-out infinite; }
  @keyframes progressGrow {
    0%   { transform: scaleX(0.05); opacity: 1; }
    60%  { transform: scaleX(0.7); opacity: 1; }
    100% { transform: scaleX(0.92); opacity: 1; }
  }

  .markdown table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 0.92rem; overflow: hidden; border-radius: 3px; }
  .markdown th, .markdown td { border: 1px solid #DCD2AE; padding: 7px 12px; text-align: left; }
  .markdown thead th { background: rgba(47,93,80,0.1); font-family: 'IBM Plex Mono', monospace; font-size: 0.74rem; text-transform: uppercase; letter-spacing: 0.04em; color: #22443B; }
  .markdown tbody tr:nth-child(even) { background: rgba(169,128,61,0.06); }
  .markdown p { margin: 0 0 8px 0; line-height: 1.65; }
  .markdown p:last-child { margin-bottom: 0; }
  .markdown ul, .markdown ol { margin: 0 0 8px 18px; line-height: 1.65; }
  .markdown strong { color: #1B2A44; font-weight: 600; }
  .markdown code { background: rgba(27,42,68,0.07); padding: 1px 6px; border-radius: 4px; font-size: 0.85em; }
  .markdown-scroll { overflow-x: auto; }

  textarea:focus { outline: none; }

  .fade-page { animation: fadeIn 400ms ease-out both; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>

<body class="font-body text-graphite">

<!-- top progress bar -->
<div class="fixed top-0 left-0 right-0 h-[3px] z-50 bg-transparent">
  <div id="progressBar" class="h-full bg-shelf opacity-0"></div>
</div>

<div class="h-screen w-screen flex overflow-hidden fade-page">

  <!-- ============ SIDEBAR: CARD CATALOG DRAWER ============ -->
  <aside id="sidebar"
    class="fixed lg:static z-30 h-full w-[300px] shrink-0 -translate-x-full lg:translate-x-0 transition-transform duration-300 flex flex-col drawer-wood shadow-2xl">

    <div class="px-5 pt-6 pb-5 border-b border-white/10">
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-sm bg-cream/95 flex items-center justify-center shadow-drawer shrink-0">
          <svg viewBox="0 0 24 24" class="w-6 h-6 text-ink" fill="none" stroke="currentColor" stroke-width="1.6">
            <path d="M3 5c2-1.2 4.5-1.6 7-1v14c-2.5-.6-5-.2-7 1V5Z" stroke-linejoin="round"/>
            <path d="M21 5c-2-1.2-4.5-1.6-7-1v14c2.5-.6 5-.2 7 1V5Z" stroke-linejoin="round"/>
          </svg>
        </div>
        <div>
          <p class="font-display text-cream text-lg leading-tight tracking-wide">SOUL 3.0</p>
          <p class="font-mono text-[10px] uppercase tracking-[0.18em] text-cream/60">Reference Desk</p>
        </div>
        <button id="closeSidebarBtn" class="lg:hidden ml-auto w-8 h-8 rounded-sm flex items-center justify-center text-cream/70 hover:text-cream hover:bg-white/10" aria-label="Close catalog">
          <svg viewBox="0 0 24 24" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"/></svg>
        </button>
      </div>

      <button id="statusBtn" type="button" class="mt-4 w-full brass-plate rounded-sm px-3 py-1.5 flex items-center justify-between text-left">
        <span class="font-mono text-[10px] uppercase tracking-[0.16em] text-ink/80">Catalog status</span>
        <span class="flex items-center gap-1.5">
          <span id="statusDot" class="w-2 h-2 rounded-full bg-graphite/40"></span>
          <span id="statusText" class="font-mono text-[10px] uppercase tracking-[0.14em] text-ink/80">checking…</span>
        </span>
      </button>
    </div>

    <div class="px-4 pt-4 pb-2">
      <p class="font-mono text-[10px] uppercase tracking-[0.2em] text-cream/65">Suggested slips — tap to file a request</p>
    </div>
    <div id="catalogList" class="flex-1 overflow-y-auto scroll-thin px-4 pb-4 space-y-2">
      <!-- populated by JS -->
    </div>

    <div class="px-5 py-4 border-t border-white/10">
      <p class="font-mono text-[9px] leading-relaxed text-cream/45">
        Connected to <span class="text-cream/75" id="apiBaseLabel">localhost:7698</span><br/>
        Text-to-SQL agent · SOUL 3.0 Library System
      </p>
    </div>
  </aside>

  <div id="backdrop" class="hidden fixed inset-0 bg-black/40 z-20 lg:hidden"></div>

  <!-- ============ MAIN ============ -->
  <div class="flex-1 flex flex-col min-w-0 relative">

    <header class="flex items-center justify-between gap-3 px-4 sm:px-8 py-4 border-b border-line/70 bg-paper/70 backdrop-blur">
      <div class="flex items-center gap-3 min-w-0">
        <button id="menuBtn" class="lg:hidden w-9 h-9 rounded-sm border border-line flex items-center justify-center shrink-0" aria-label="Open catalog">
          <svg viewBox="0 0 24 24" class="w-5 h-5 text-ink" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h16" stroke-linecap="round"/></svg>
        </button>
        <div class="min-w-0">
          <h1 class="font-display text-xl sm:text-2xl text-ink truncate">Ask the Reference Desk</h1>
          <p class="font-mono text-[11px] text-graphite/55 truncate hidden sm:block">Natural language in — indexed T-SQL answers out</p>
        </div>
      </div>
      <button id="newSessionBtn" class="flex items-center gap-2 font-mono text-[11px] uppercase tracking-wide text-shelf border border-shelf/40 px-3 py-1.5 rounded-sm hover:bg-shelf hover:text-cream transition-colors shrink-0">
        <svg viewBox="0 0 24 24" class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>
        <span class="hidden sm:inline">New drawer</span>
      </button>
    </header>

    <main id="chatArea" class="flex-1 overflow-y-auto scroll-thin px-4 sm:px-8 py-6 relative">
      <div id="chatInner" class="max-w-3xl mx-auto flex flex-col gap-6 pb-4"></div>
    </main>

    <!-- scroll-to-latest -->
    <button id="scrollLatestBtn" class="hidden absolute bottom-24 right-6 sm:right-10 items-center gap-1.5 bg-ink text-cream font-mono text-[10px] uppercase tracking-wide px-3 py-2 rounded-full shadow-card hover:bg-shelfdk transition-colors">
      <svg viewBox="0 0 24 24" class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M6 13l6 6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Latest
    </button>

    <footer class="border-t border-line/70 bg-paper/80 backdrop-blur px-4 sm:px-8 py-4">
      <form id="composerForm" class="max-w-3xl mx-auto">
        <div class="flex items-end gap-2 bg-cream border border-line rounded-md shadow-card px-3 py-2 focus-within:border-shelf transition-colors">
          <textarea
            id="questionInput"
            rows="1"
            placeholder="Type a question — e.g. Computer science subject par 5 available books ke title aur author dikhao…"
            class="flex-1 resize-none bg-transparent max-h-40 py-2 px-1 font-body text-[15px] text-graphite placeholder:text-graphite/40"
            aria-label="Ask a question"
          ></textarea>
          <button id="sendBtn" type="submit" disabled
            class="shrink-0 flex items-center gap-2 bg-shelf hover:bg-shelfdk disabled:opacity-40 disabled:cursor-not-allowed text-cream font-mono text-[11px] uppercase tracking-wider px-4 py-2.5 rounded-sm transition-colors">
            <span id="sendBtnLabel">Check Out</span>
            <svg id="sendIcon" viewBox="0 0 24 24" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <p class="font-mono text-[10px] text-graphite/45 mt-1.5 px-1">Enter to send · Shift+Enter for a new line</p>
      </form>
    </footer>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ---------------------------------------------------------
  // CONFIG
  // ---------------------------------------------------------
  const API_BASE = "http://localhost:7698";
  const FALLBACK_QUESTIONS = [
    "Library me total kitni physical books hain aur usme se kitni unique titles hain? Sirf count batao.",
    "Computer science subject par 5 available books ke title aur author dikhao.",
    "Aise 10 members dikhao jinki books overdue hain. Member ka naam, book title aur due date do.",
    "UNNATI SINGH naam ki member ki poori details do aur uski issue history bhi dikhao.",
    "Computer Centre department me kitne active students hain? Naam aur member ID list karo.",
    "Pichle 1 saal me sabse zyada issue ki gayi 3 books kaun si hain?"
  ];

  marked.setOptions({ breaks: true, gfm: true });

  // ---------------------------------------------------------
  // ELEMENTS
  // ---------------------------------------------------------
  const chatInner      = document.getElementById("chatInner");
  const chatArea       = document.getElementById("chatArea");
  const form           = document.getElementById("composerForm");
  const input          = document.getElementById("questionInput");
  const sendBtn        = document.getElementById("sendBtn");
  const sendLabel      = document.getElementById("sendBtnLabel");
  const statusDot      = document.getElementById("statusDot");
  const statusText     = document.getElementById("statusText");
  const statusBtn      = document.getElementById("statusBtn");
  const catalogList    = document.getElementById("catalogList");
  const sidebar        = document.getElementById("sidebar");
  const backdrop       = document.getElementById("backdrop");
  const menuBtn        = document.getElementById("menuBtn");
  const closeSidebarBtn= document.getElementById("closeSidebarBtn");
  const newSessionBtn  = document.getElementById("newSessionBtn");
  const scrollLatestBtn= document.getElementById("scrollLatestBtn");
  const progressBar    = document.getElementById("progressBar");
  document.getElementById("apiBaseLabel").textContent = API_BASE.replace(/^https?:\/\//, "");

  let cardCounter = 0;
  let busy = false;
  let userScrolledUp = false;

  // ---------------------------------------------------------
  // SIDEBAR TOGGLE (mobile)
  // ---------------------------------------------------------
  function openSidebar() { sidebar.classList.remove("-translate-x-full"); backdrop.classList.remove("hidden"); }
  function closeSidebar() { sidebar.classList.add("-translate-x-full"); backdrop.classList.add("hidden"); }
  menuBtn.addEventListener("click", openSidebar);
  closeSidebarBtn.addEventListener("click", closeSidebar);
  backdrop.addEventListener("click", closeSidebar);

  // ---------------------------------------------------------
  // TEXTAREA AUTOSIZE + SEND BUTTON ENABLE STATE
  // ---------------------------------------------------------
  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 160) + "px";
    sendBtn.disabled = !input.value.trim() || busy;
  });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      if (!sendBtn.disabled) form.requestSubmit();
    }
  });

  // ---------------------------------------------------------
  // SCROLL TRACKING (scroll-to-latest button)
  // ---------------------------------------------------------
  chatArea.addEventListener("scroll", () => {
    const distanceFromBottom = chatArea.scrollHeight - chatArea.scrollTop - chatArea.clientHeight;
    userScrolledUp = distanceFromBottom > 160;
    scrollLatestBtn.classList.toggle("hidden", !userScrolledUp);
    scrollLatestBtn.classList.toggle("flex", userScrolledUp);
  });
  scrollLatestBtn.addEventListener("click", () => { userScrolledUp = false; scrollToBottom(true); });

  function scrollToBottom(force) {
    if (userScrolledUp && !force) return;
    chatArea.scrollTo({ top: chatArea.scrollHeight, behavior: "smooth" });
  }

  // ---------------------------------------------------------
  // TOP PROGRESS BAR
  // ---------------------------------------------------------
  function progressStart() {
    progressBar.style.opacity = "1";
    progressBar.classList.add("loading");
  }
  function progressFinish() {
    progressBar.classList.remove("loading");
    progressBar.style.transform = "scaleX(1)";
    setTimeout(() => {
      progressBar.style.opacity = "0";
      progressBar.style.transform = "scaleX(0)";
    }, 260);
  }

  // ---------------------------------------------------------
  // HEALTH CHECK (robust: treats any successful round trip as "online" too)
  // ---------------------------------------------------------
  function setStatus(online) {
    if (online) {
      statusDot.className = "w-2 h-2 rounded-full bg-shelf pulse-dot";
      statusText.textContent = "online";
    } else {
      statusDot.className = "w-2 h-2 rounded-full bg-stamp";
      statusText.textContent = "offline";
    }
  }
  async function checkHealth() {
    statusText.textContent = "checking…";
    statusDot.className = "w-2 h-2 rounded-full bg-gold/70";
    try {
      const res = await fetch(API_BASE + "/", { method: "GET", cache: "no-store" });
      setStatus(res.ok);
    } catch (e) {
      setStatus(false);
    }
  }
  statusBtn.addEventListener("click", checkHealth);
  checkHealth();
  setInterval(checkHealth, 20000);

  // ---------------------------------------------------------
  // LOAD SAMPLE QUESTIONS INTO CATALOG DRAWER
  // ---------------------------------------------------------
  function renderCatalog(questions) {
    catalogList.innerHTML = "";
    questions.forEach((q, i) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "w-full text-left bg-cream/95 hover:bg-cream border border-black/10 rounded-sm px-3 py-2.5 transition-transform hover:-translate-y-0.5 group";
      btn.innerHTML = `
        <div class="flex items-start gap-2">
          <span class="font-mono text-[10px] mt-0.5 text-gold shrink-0">${String(i + 1).padStart(2, "0")}</span>
          <span class="font-body text-[12.5px] leading-snug text-graphite/90 group-hover:text-ink">${escapeHtml(q)}</span>
        </div>`;
      btn.addEventListener("click", () => {
        input.value = q;
        input.dispatchEvent(new Event("input"));
        input.focus();
        if (window.innerWidth < 1024) closeSidebar();
      });
      catalogList.appendChild(btn);
    });
  }

  async function loadCatalog() {
    try {
      const res = await fetch(API_BASE + "/welcome");
      if (!res.ok) throw new Error("bad status");
      const data = await res.json();
      const qs = Array.isArray(data.sample_questions) ? data.sample_questions : FALLBACK_QUESTIONS;
      renderCatalog(qs);
      setStatus(true);
    } catch (e) {
      renderCatalog(FALLBACK_QUESTIONS);
    }
  }
  loadCatalog();

  // ---------------------------------------------------------
  // UTIL
  // ---------------------------------------------------------
  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function nowParts() {
    const d = new Date();
    return {
      time: d.toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit" }),
      date: d.toLocaleDateString("en-GB", { day: "2-digit", month: "short" }),
      full: d.toLocaleDateString("en-GB", { day: "2-digit", month: "short", year: "numeric" }) +
            " · " + d.toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit" }),
    };
  }

  // ---------------------------------------------------------
  // RENDER: WELCOME EMPTY STATE
  // ---------------------------------------------------------
  function renderEmptyState() {
    const el = document.createElement("div");
    el.id = "emptyState";
    el.className = "flex flex-col items-center justify-center text-center py-16 gap-4";
    el.innerHTML = `
      <div class="w-16 h-16 rounded-full bg-shelf/10 border border-shelf/30 flex items-center justify-center">
        <svg viewBox="0 0 24 24" class="w-8 h-8 text-shelf" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M3 5c2-1.2 4.5-1.6 7-1v14c-2.5-.6-5-.2-7 1V5Z" stroke-linejoin="round"/>
          <path d="M21 5c-2-1.2-4.5-1.6-7-1v14c2.5-.6 5-.2 7 1V5Z" stroke-linejoin="round"/>
        </svg>
      </div>
      <div>
        <p class="font-display text-xl text-ink">The drawer is open.</p>
        <p class="font-body text-sm text-graphite/60 mt-1 max-w-sm mx-auto">Ask about members, issued books, overdue titles, subjects, or request a chart — pick a slip on the left, or type your own below.</p>
      </div>`;
    chatInner.appendChild(el);
  }
  renderEmptyState();

  function clearEmptyState() {
    const el = document.getElementById("emptyState");
    if (el) el.remove();
  }

  // ---------------------------------------------------------
  // RENDER: USER SLIP
  // ---------------------------------------------------------
  function renderUserSlip(question) {
    clearEmptyState();
    const wrap = document.createElement("div");
    wrap.className = "flex justify-end card-enter";
    wrap.innerHTML = `
      <div class="max-w-[85%] sm:max-w-[70%]">
        <div class="slip-tab bg-ink text-cream px-4 py-3 shadow-card">
          <p class="font-body text-[14.5px] leading-relaxed whitespace-pre-wrap">${escapeHtml(question)}</p>
        </div>
        <p class="font-mono text-[10px] text-graphite/45 text-right mt-1 pr-1">${nowParts().full}</p>
      </div>`;
    chatInner.appendChild(wrap);
    scrollToBottom(true);
  }

  // ---------------------------------------------------------
  // RENDER: LOADING CARD
  // ---------------------------------------------------------
  function renderLoadingCard() {
    const wrap = document.createElement("div");
    wrap.className = "flex justify-start card-enter";
    wrap.id = "loadingCard";
    wrap.innerHTML = `
      <div class="max-w-[85%] sm:max-w-[75%] bg-paper border border-line rounded-sm shadow-card px-5 py-4 flex items-center gap-3">
        <div class="flex gap-1 card-slide">
          <span class="w-1.5 h-6 bg-shelf/70 rounded-sm"></span>
          <span class="w-1.5 h-6 bg-gold/70 rounded-sm"></span>
          <span class="w-1.5 h-6 bg-stamp/60 rounded-sm"></span>
        </div>
        <p class="font-mono text-[12px] text-graphite/60 uppercase tracking-wide">Pulling the card, drafting SQL…</p>
      </div>`;
    chatInner.appendChild(wrap);
    scrollToBottom(true);
    return wrap;
  }

  // ---------------------------------------------------------
  // RENDER: CATALOG (ASSISTANT) CARD
  // ---------------------------------------------------------
  function renderAssistantCard({ answer, sql_query, chart_base64, attempts, debug_error }) {
    cardCounter += 1;
    const cardId = "card-" + cardCounter;
    const hasChart = !!chart_base64;
    const hasError = !!debug_error;
    const callNo = "LIB." + String(cardCounter).padStart(3, "0");
    const t = nowParts();

    const wrap = document.createElement("div");
    wrap.className = "flex justify-start card-enter";

    const sqlBlockId = cardId + "-sql";
    const stampClasses = hasError
      ? "stamp fire border-2 border-stamp text-stamp rounded-full w-[88px] h-[88px] flex flex-col items-center justify-center gap-0.5 bg-paper/70 backdrop-blur-[1px]"
      : "stamp fire border-2 border-shelf text-shelf rounded-full w-[88px] h-[88px] flex flex-col items-center justify-center gap-0.5 bg-paper/70 backdrop-blur-[1px]";

    wrap.innerHTML = `
      <div class="relative max-w-[92%] sm:max-w-[80%] w-full pt-6 pr-6">
        <!-- stamp: sits above/outside the card corner, never over content -->
        <div class="stamp-wrap absolute top-0 right-0 z-10">
          <div class="${stampClasses}">
            <span class="font-mono text-[8px] uppercase tracking-[0.1em] leading-none">${hasError ? 'flagged' : 'indexed'}</span>
            <span class="font-mono text-[12px] font-semibold leading-none">${t.time}</span>
            <span class="font-mono text-[8px] uppercase tracking-[0.08em] leading-none opacity-80">${t.date}</span>
          </div>
        </div>

        <div class="punch-wrap relative ruled bg-paper border border-line rounded-sm shadow-card pt-5 pb-4 px-5 sm:px-6">
          <span class="ring-hole"></span>

          <!-- header row -->
          <div class="flex items-center justify-between gap-3 mb-3 pb-2 pl-6 border-b border-dashed border-line">
            <span class="font-mono text-[10px] uppercase tracking-[0.15em] text-gold">Card No. ${callNo}</span>
            ${attempts ? `<span class="font-mono text-[9px] uppercase tracking-wide text-graphite/40 bg-graphite/5 px-2 py-0.5 rounded-full">${attempts} pass${attempts > 1 ? "es" : ""}</span>` : ``}
          </div>

          <!-- answer -->
          <div class="markdown markdown-scroll font-body text-[14.5px] text-graphite leading-relaxed">${marked.parse(answer || "_No answer returned._")}</div>

          ${hasError ? `
          <div class="mt-3 flex items-start gap-2 bg-stamp/10 border border-stamp/30 rounded-sm px-3 py-2">
            <svg viewBox="0 0 24 24" class="w-4 h-4 text-stamp shrink-0 mt-0.5" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4m0 4h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <p class="font-mono text-[11px] text-stamp/90 leading-relaxed break-words">${escapeHtml(debug_error)}</p>
          </div>` : ``}

          ${hasChart ? `
          <div class="mt-4">
            <div class="bg-cream border border-line rounded-sm p-2 sm:p-3">
              <img src="data:image/png;base64,${chart_base64}" alt="Generated chart for the query" class="w-full h-auto rounded-[2px]" loading="lazy" />
            </div>
            <div class="flex items-center justify-between mt-1.5 pl-1">
              <p class="font-mono text-[10px] text-graphite/45">Fig. — plotted from the result set above</p>
              <a href="data:image/png;base64,${chart_base64}" download="soul-chart-${callNo}.png" class="font-mono text-[10px] uppercase tracking-wide text-shelf hover:text-shelfdk">Download</a>
            </div>
          </div>` : ``}

          <!-- SQL slip -->
          ${sql_query ? `
          <div class="mt-4">
            <button type="button" class="sql-toggle w-full flex items-center justify-between font-mono text-[11px] uppercase tracking-wide text-shelf hover:text-shelfdk bg-shelf/10 hover:bg-shelf/15 border border-shelf/25 rounded-sm px-3 py-2 transition-colors">
              <span class="flex items-center gap-2">
                <svg viewBox="0 0 24 24" class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 9l-4 3 4 3M16 9l4 3-4 3M13 5l-2 14" stroke-linecap="round" stroke-linejoin="round"/></svg>
                View indexed query
              </span>
              <svg class="chevron w-3.5 h-3.5 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <div id="${sqlBlockId}" class="hidden mt-2">
              <div class="relative bg-ink rounded-sm overflow-hidden">
                <button type="button" class="copy-sql absolute top-2 right-2 font-mono text-[10px] uppercase tracking-wide text-cream/70 hover:text-cream bg-white/5 hover:bg-white/10 px-2 py-1 rounded-sm">Copy</button>
                <pre class="font-mono text-[12px] text-cream/90 leading-relaxed overflow-x-auto p-4 pr-16 whitespace-pre-wrap">${escapeHtml(sql_query)}</pre>
              </div>
            </div>
          </div>` : ``}
        </div>
      </div>`;

    chatInner.appendChild(wrap);

    const toggleBtn = wrap.querySelector(".sql-toggle");
    if (toggleBtn) {
      toggleBtn.addEventListener("click", () => {
        const target = wrap.querySelector("#" + CSS.escape(sqlBlockId));
        const chevron = toggleBtn.querySelector(".chevron");
        target.classList.toggle("hidden");
        chevron.style.transform = target.classList.contains("hidden") ? "rotate(0deg)" : "rotate(180deg)";
      });
    }
    const copyBtn = wrap.querySelector(".copy-sql");
    if (copyBtn) {
      copyBtn.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(sql_query);
          const original = copyBtn.textContent;
          copyBtn.textContent = "Copied";
          setTimeout(() => (copyBtn.textContent = original), 1500);
        } catch (e) { /* clipboard unavailable — silently ignore */ }
      });
    }

    scrollToBottom();
  }

  // ---------------------------------------------------------
  // SEND FLOW
  // ---------------------------------------------------------
  async function sendQuestion(question) {
    if (busy || !question.trim()) return;
    busy = true;
    sendBtn.disabled = true;
    sendLabel.textContent = "Filing…";
    progressStart();

    renderUserSlip(question);
    const loadingCard = renderLoadingCard();

    try {
      const res = await fetch(API_BASE + "/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question }),
      });

      if (!res.ok) {
        const text = await res.text().catch(() => "");
        throw new Error(`Server responded ${res.status}. ${text}`.trim());
      }

      const data = await res.json();
      loadingCard.remove();
      renderAssistantCard({
        answer: data.answer,
        sql_query: data.sql_query,
        chart_base64: data.chart_base64,
        attempts: data.attempts,
        debug_error: data.debug_error,
      });
      setStatus(true);
    } catch (err) {
      loadingCard.remove();
      renderAssistantCard({
        answer: `**Could not reach the reference desk.**\n\nMake sure the backend is running and CORS is enabled:\n\n\`uvicorn main:app --reload --port 7698\`\n\nDetails: ${err.message || err}`,
        sql_query: "",
        chart_base64: null,
        attempts: 0,
        debug_error: err.message || String(err),
      });
      setStatus(false);
    } finally {
      busy = false;
      sendBtn.disabled = !input.value.trim();
      sendLabel.textContent = "Check Out";
      progressFinish();
    }
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const q = input.value;
    if (!q.trim()) return;
    input.value = "";
    input.style.height = "auto";
    sendBtn.disabled = true;
    sendQuestion(q);
  });

  newSessionBtn.addEventListener("click", () => {
    chatInner.innerHTML = "";
    cardCounter = 0;
    userScrolledUp = false;
    scrollLatestBtn.classList.add("hidden");
    scrollLatestBtn.classList.remove("flex");
    renderEmptyState();
  });

})();
</script>

</body>
</html>
